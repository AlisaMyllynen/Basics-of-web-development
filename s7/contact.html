<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <title>Centria Edu | Contact</title>
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="topics" id="contact">
            <div class="container">

                <h2>Contact us</h2>
                <p class="form-intro">
                    Fill in the form below and we will get back to you. Fields marked with * are required.
                    Please use fictitious information when testing.
                </p>

                <form class="card contact-form" action="https://httpbin.org/post" method="post">

                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" autocomplete="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email address *</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone number (optional)</label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel">
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <select id="subject" name="subject" required>
                            <option value="">Choose a subject</option>
                            <option value="feedback">Feedback</option>
                            <option value="question">Question</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <fieldset class="form-group">
                        <legend>Preferred contact method</legend>
                        <label class="radio-label">
                            <input type="radio" name="contact_method" value="email" checked>
                            Email
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="contact_method" value="phone">
                            Phone
                        </label>
                    </fieldset>

                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>

                    <button type="submit" class="button">Send message</button>

                </form>

            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Centria Edu</p>
        </div>
    </footer>

</body>
</html>
